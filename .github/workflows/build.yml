name: 自动更新博客文章

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # 每天国际标准时间 0 点运行
  workflow_dispatch: # 允许手动触发

jobs:
  update_readme_with_cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 重要：授予写权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install feedparser

      - name: 生成带封面的博客卡片
        run: python build_readme.py

      - name: 提交并推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          # 使用 diff --quiet 检查暂存区是否有变化，有变化才 commit
          git diff --staged --quiet || (git commit -m "feat: 更新博客文章卡片墙 [skip ci]" && git push)
